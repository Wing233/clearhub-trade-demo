server:
  port: ${SERVER_PORT:8091}

spring:
  application:
    name: mock-bank
  datasource:
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:trade_demo}?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
    username: ${DB_USER:trade}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 6
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        jdbc:
          time_zone: Asia/Shanghai
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

mock:
  bank:
    name: 演示银行
    accounts:
      - account-no: BANK-MM001
        firm-id: 1
        balance: 100000000.00
      - account-no: BANK-DEMO001
        firm-id: 2
        balance: 10000000.00
      - account-no: BANK-DEMO002
        firm-id: 3
        balance: 10000000.00

logging:
  level:
    com.clearhub.mockbank: INFO
