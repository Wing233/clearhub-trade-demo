name: Keep Render warm

on:
  schedule:
    # GitHub Actions uses UTC. 02:00-13:55 UTC = 10:00-21:55 Asia/Shanghai.
    - cron: "*/5 2-13 * * *"
    # 14:00 UTC = 22:00 Asia/Shanghai (last ping, then the service may sleep).
    - cron: "0 14 * * *"
  workflow_dispatch:

concurrency:
  group: render-keepalive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Ping Render health endpoint
        run: |
          set -u
          url="https://clearhub-trade-demo.onrender.com/actuator/health"
          for attempt in 1 2 3; do
            code=$(curl -s -o /tmp/health.json -w "%{http_code}" --max-time 180 "$url" || true)
            echo "attempt ${attempt}: HTTP ${code}"
            if [ "$code" = "200" ]; then
              cat /tmp/health.json
              exit 0
            fi
            sleep 20
          done
          echo "Render health check did not return 200" >&2
          exit 1
