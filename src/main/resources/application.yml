server:
  port: ${PORT:${SERVER_PORT:8080}}
  shutdown: graceful

spring:
  application:
    name: trade-core
  datasource:
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:trade_demo}?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
    username: ${DB_USER:trade}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 12
      minimum-idle: 2
      connection-timeout: 5000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        jdbc:
          time_zone: Asia/Shanghai
        format_sql: false
    show-sql: false
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null
  lifecycle:
    timeout-per-shutdown-phase: 20s

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method

integration:
  enabled: ${INTEGRATION_ENABLED:true}
  mode: ${INTEGRATION_MODE:http}
  adapter-base-url: ${ADAPTER_BASE_URL:http://127.0.0.1:8090}
  timeout-ms: ${ADAPTER_TIMEOUT_MS:5000}

demo:
  seed-on-start: ${DEMO_SEED:true}
  reset-enabled: ${DEMO_RESET_ENABLED:true}
  market-maker:
    enabled: ${DEMO_MM_ENABLED:true}
    firm-id: 1
    interval-ms: 3000
    spread-ticks: 2
    levels: 3
    min-quantity: 10
    max-quantity: 60
    max-price-drift: 0.004
  flow-trader:
    enabled: ${DEMO_FLOW_ENABLED:true}
    firm-id: 4
    interval-ms: 2500
    min-quantity: 5
    max-quantity: 30
  accounts:
    - id: 1
      code: MM001
      name: 做市商账户
      cash: 100000000.00
      position: 1000000
    - id: 2
      code: DEMO001
      name: 演示用户
      cash: 10000000.00
      position: 100000
    - id: 3
      code: DEMO002
      name: 演示用户 B
      cash: 10000000.00
      position: 100000
    - id: 4
      code: FLOW001
      name: 模拟交易员
      cash: 1000000000.00
      position: 5000000

logging:
  level:
    root: INFO
    com.clearhub.trade: INFO
    org.hibernate.SQL: WARN
