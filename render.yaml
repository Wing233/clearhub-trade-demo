services:
  - type: web
    name: clearhub-trade-demo
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile.render
    healthCheckPath: /actuator/health
    autoDeploy: true
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: h2
      - key: SPRING_WEB_RESOURCES_STATIC_LOCATIONS
        value: file:/app/static/
      - key: JAVA_OPTS
        value: "-Xms48m -Xmx192m -XX:MaxMetaspaceSize=96m -Xss512k -XX:MaxDirectMemorySize=32m -XX:+UseSerialGC -XX:ActiveProcessorCount=1"
      - key: DEMO_RESET_ENABLED
        value: "true"
      - key: DEMO_MM_ENABLED
        value: "true"
      - key: DEMO_FLOW_ENABLED
        value: "true"
